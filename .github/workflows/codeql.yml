name: "CodeQL"

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: "23 2 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [ "csharp", "javascript-typescript" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@397b4764c5bc24305eb8b7267d26b1f20ed9f986 # v3.30.4
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@397b4764c5bc24305eb8b7267d26b1f20ed9f986 # v3.30.4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@397b4764c5bc24305eb8b7267d26b1f20ed9f986 # v3.30.4
